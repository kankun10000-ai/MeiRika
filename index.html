<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>中2理科 単元2 テスト対策</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--g:#1a7f3c;--gl:#e4f2e8;--b:#1a5fb4;--r:#d6001c;--bg:#f6f8f5;--card:#fff;--line:#d5ddd6;--tx:#1b1f1c;--mut:#5d675f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:#dfe6e0}
body{font-family:"Zen Maru Gothic",sans-serif;color:var(--tx);line-height:1.6;font-size:15px}
#wrap{position:fixed;inset:0;margin:0 auto;max-width:480px;height:100dvh;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
header{flex:none;height:46px;background:var(--g);color:#fff;padding:0 12px;display:flex;align-items:center;gap:8px}
header h1{font-size:15px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{flex:none;background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:8px;padding:5px 12px;font:inherit;font-size:13px}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:8px 10px 10px;overflow:hidden}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.btn{font:inherit;font-weight:700;border-radius:10px;border:2px solid var(--g);background:#fff;color:var(--g);padding:4px;min-height:44px;cursor:pointer;line-height:1.2}
.btn.p{background:var(--g);color:#fff}.btn.blue{border-color:var(--b);color:var(--b)}
.btn.red{border-color:var(--r);color:var(--r)}.btn:disabled{opacity:.35}
.btn small{display:block;font-weight:400;font-size:10px}
.mut{color:var(--mut);font-size:12px}
.bar{height:6px;background:var(--gl);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
/* home */
.tot{flex:none;display:flex;align-items:center;gap:10px}
.tot b{font-size:26px;color:var(--g);line-height:1}
.sec{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
.sec .hd{display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;white-space:nowrap}
.sec .hd span{flex:none;background:var(--g);color:#fff;border-radius:7px;padding:0 8px}
.sec .hd em{font-style:normal;margin-left:auto;color:var(--g);font-size:13px}
.sec .hd i{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.modes{display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr;gap:6px}
.modes .btn{min-height:38px;font-size:13px}
.foot{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* quiz */
.top{flex:none}.top .mut{display:flex;justify-content:space-between;margin-bottom:3px}
.qbox{flex:1;min-height:0;overflow:hidden;font-size:17px}
.qbox .t{font-size:.72em;color:var(--mut)}
.qbox .lead{background:var(--gl);border-radius:8px;padding:.4em .6em;font-size:.82em;margin:.3em 0 .5em}
.qbox .q{font-weight:700}
.qbox .ans{border:2px solid var(--r);border-radius:8px;padding:.3em .6em;color:var(--r);font-weight:700;margin-top:.6em}
.bottom{flex:none;display:grid;gap:7px}
.opt{font:inherit;text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:4px 12px;height:50px;overflow:hidden;white-space:nowrap;font-size:24px;cursor:pointer;color:var(--tx);line-height:1.3}
.opt.ok{border-color:var(--g);background:var(--gl);font-weight:700}.opt.ng{border-color:var(--r);color:var(--r)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.scr{flex:6 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;font-size:27px;line-height:1.5}
.scr .t{font-size:.6em;color:var(--mut)}.scr .lead{background:var(--gl);border-radius:8px;padding:.4em .6em;font-size:.8em;margin:.5em 0 .2em}.scr .q{font-weight:700}
.bans{border:3px solid var(--r);border-radius:10px;background:#fff;color:var(--r);font-weight:700;font-size:30px;line-height:1.25;padding:4px 10px;text-align:center;flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.low{flex:4 1 0;min-height:0;display:flex;flex-direction:column;gap:7px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px}
.grid .opt{min-height:0;min-width:0;height:auto;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 8px;border-width:3px;border-radius:14px}
.low .btn{flex:none;min-height:42px;font-size:16px}
.low #rv{flex:1;font-size:26px}
/* summary */
.sum h2{font-size:1em;color:var(--b);border-left:5px solid var(--b);padding-left:8px;margin:0 0 .4em}
.sum ul{padding-left:1.2em;margin:.2em 0}.sum li{margin:.15em 0}.sum b.g{color:var(--g)}.sum b.b{color:var(--b)}
.sum .box{border:2px solid var(--g);border-radius:8px;padding:.3em .6em;margin:.4em 0}
.sum table{border-collapse:collapse;font-size:.82em;margin:.4em 0;width:100%}
.sum td,.sum th{border:1px solid #777;padding:.15em .3em;text-align:center}.sum th{background:var(--gl)}
.sum .small{font-size:.85em}.sum p{margin:.2em 0}
/* stats */
table.st{border-collapse:collapse;width:100%;font-size:.8em}
table.st td,table.st th{border-bottom:1px solid var(--line);padding:.45em .2em;text-align:center}
table.st td:first-child{text-align:left;font-weight:700}table.st b{color:var(--g)}
.big{font-size:44px;font-weight:700;color:var(--g);text-align:center;line-height:1.2}
.c{text-align:center}
/* ⭕❌ */
#fx{position:fixed;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:20}
#fx.on{display:flex}
#fx span{font-size:min(46vw,210px);line-height:1;animation:pop .75s ease-out forwards;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
@keyframes pop{0%{transform:scale(.2) rotate(-25deg);opacity:0}35%{transform:scale(1.15) rotate(0);opacity:1}55%{transform:scale(.95)}75%{transform:scale(1);opacity:1}100%{transform:scale(1.25);opacity:0}}
#fx.bad span{animation-name:shake}
@keyframes shake{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.1) translateX(0);opacity:1}40%{transform:translateX(-14px)}55%{transform:translateX(14px)}70%{transform:translateX(-8px);opacity:1}100%{transform:translateX(0) scale(1.1);opacity:0}}
#wrap.flashok{animation:fo .5s}#wrap.flashng{animation:fn .5s}
@keyframes fo{30%{background:#c9ecd3}}@keyframes fn{30%{background:#f8cfd3}}
</style></head><body>
<div id="wrap"><header><h1 id="hd"></h1><button id="home" hidden>もどる</button></header><main id="app"></main></div>
<div id="fx"><span></span></div>
<script>
const D=[{"no": "1", "ttl": "光合成と呼吸", "ch": "第2章 植物のからだのつくりとはたらき", "sum": "\n<h2>光合成のしくみ<\/h2>\n<ul>\n<li><b class=g>光合成<\/b>…植物が光を受けて、デンプンなどの養分をつくるはたらき。細胞の中の緑色の粒＝<b class=g>葉緑体<\/b>で行われる。<\/li>\n<li>ふ入りの葉の白い部分には葉緑体がない → 光を当ててもデンプンはできない。<\/li>\n<\/ul>\n<div class=box style=\"text-align:center\"><b class=b>水<\/b> ＋ <b class=b>二酸化炭素<\/b> ――（光）→ <b class=g>デンプンなど<\/b> ＋ <b class=g>酸素<\/b><\/div>\n<h2>デンプンを調べる手順<\/h2>\n<ul>\n<li>あたためた<b class=g>エタノール<\/b>に葉を入れて<b class=g>脱色<\/b>する（色の変化を見やすくするため）。<\/li>\n<li>エタノールは<b class=b>引火しやすい<\/b> → 火で直接加熱せず、熱湯につけてあたためる。<\/li>\n<li><b class=g>ヨウ素液<\/b>をつける → デンプンがあれば<b class=g>青紫色<\/b>。<\/li>\n<li><b class=g>対照実験<\/b>…調べたい条件を1つだけ変え、ほかの条件を同じにして行う実験。<\/li>\n<\/ul>\n<h2>光合成で出る気体<\/h2>\n<ul><li>光を当てた水草から出る泡 ＝ <b class=g>酸素<\/b>。火のついた線香を入れると、炎を上げて激しく燃える。<\/li><\/ul>\n<h2>BTB溶液で調べる（息をふきこんで緑色にしてから始める）<\/h2>\n<p class=small style=\"margin:0\">BTB溶液の色：酸性＝<b class=b>黄<\/b>、中性＝<b class=b>緑<\/b>、アルカリ性＝<b class=b>青<\/b>　（二酸化炭素がふえると黄色側、減ると青色側）<\/p>\n<table class=t><tr><th><\/th><th>水草あり<\/th><th>水草なし<\/th><\/tr>\n<tr><th>光あり<\/th><td><b class=g>青<\/b>（光合成で二酸化炭素が減少）<\/td><td>緑のまま<\/td><\/tr>\n<tr><th>光なし（アルミはく）<\/th><td><b class=g>黄<\/b>（呼吸で二酸化炭素が増加）<\/td><td>緑のまま<\/td><\/tr><\/table>\n<h2>植物の呼吸<\/h2>\n<ul>\n<li>呼吸は<b class=g>昼も夜も<\/b>行う。光合成は光の当たる<b class=g>昼だけ<\/b>。<\/li>\n<li>昼は 光合成で出入りする気体の量 ＞ 呼吸で出入りする気体の量 → 全体として<b class=b>二酸化炭素を吸収し、酸素を出している<\/b>ように見える。<\/li>\n<\/ul>\n<table class=t><tr><th>ふくろの条件<\/th><th>葉・明るいところ<\/th><th>葉・暗いところ<\/th><th>空気だけ・暗いところ<\/th><\/tr>\n<tr><th>石灰水<\/th><td>変化なし<\/td><td><b class=g>白くにごる<\/b>（呼吸）<\/td><td>変化なし（対照）<\/td><\/tr><\/table>\n<h2>気孔<\/h2>\n<ul><li><b class=g>気孔<\/b>…葉の表皮にある、2つの<b class=g>孔辺細胞<\/b>に囲まれたすきま。酸素・二酸化炭素・水蒸気の出入り口。<\/li><\/ul>\n", "fill": [{"q": "植物が光を受けてデンプンなどの養分をつくるはたらきを【　？　】といい、細胞の中にある緑色の粒の葉緑体で行われる。", "a": "光合成", "o": ["呼吸", "蒸散", "吸水", "消化"]}, {"q": "植物が光を受けてデンプンなどの養分をつくるはたらきを光合成といい、細胞の中にある緑色の粒の【　？　】で行われる。", "a": "葉緑体", "o": ["核", "液胞", "細胞壁", "細胞膜"]}, {"q": "デンプンがあるかどうかは【　？　】で調べる。デンプンがあると青紫色に変わる。調べる前に、葉をあたためたエタノールに入れて脱色しておく。この液は引火しやすいので、火で直接加熱せず熱湯につけてあたためる。", "a": "ヨウ素液", "o": ["BTB溶液", "ベネジクト液", "石灰水", "酢酸カーミン液"]}, {"q": "デンプンがあるかどうかはヨウ素液で調べる。デンプンがあると【　？　】色に変わる。調べる前に、葉をあたためたエタノールに入れて脱色しておく。この液は引火しやすいので、火で直接加熱せず熱湯につけてあたためる。", "a": "青紫", "o": ["赤褐", "黄", "白", "緑"]}, {"q": "デンプンがあるかどうかはヨウ素液で調べる。デンプンがあると青紫色に変わる。調べる前に、葉をあたためた【　？　】に入れて脱色しておく。この液は引火しやすいので、火で直接加熱せず熱湯につけてあたためる。", "a": "エタノール", "o": ["食塩水", "石灰水", "BTB溶液", "ベネジクト液"]}, {"q": "デンプンがあるかどうかはヨウ素液で調べる。デンプンがあると青紫色に変わる。調べる前に、葉をあたためたエタノールに入れて【　？　】しておく。この液は引火しやすいので、火で直接加熱せず熱湯につけてあたためる。", "a": "脱色", "o": ["染色", "消毒", "冷却", "乾燥"]}, {"q": "デンプンがあるかどうかはヨウ素液で調べる。デンプンがあると青紫色に変わる。調べる前に、葉をあたためたエタノールに入れて脱色しておく。この液は【　？　】しやすいので、火で直接加熱せず熱湯につけてあたためる。", "a": "引火", "o": ["沈殿", "凍結", "変色"]}, {"q": "デンプンがあるかどうかはヨウ素液で調べる。デンプンがあると青紫色に変わる。調べる前に、葉をあたためたエタノールに入れて脱色しておく。この液は引火しやすいので、火で直接加熱せず【　？　】につけてあたためる。", "a": "熱湯", "o": ["氷水", "食塩水", "石灰水"]}, {"q": "光合成の材料は、根から吸い上げた【　？　】と、空気中からとり入れた二酸化炭素である。デンプンなどのほかに（　　）ができる。", "a": "水", "o": ["酸素", "窒素", "デンプン"]}, {"q": "光合成の材料は、根から吸い上げた水と、空気中からとり入れた【　？　】である。デンプンなどのほかに（　　）ができる。", "a": "二酸化炭素", "o": ["酸素", "窒素", "水素", "水蒸気"]}, {"q": "光合成の材料は、根から吸い上げた水と、空気中からとり入れた（　　）である。デンプンなどのほかに【　？　】ができる。", "a": "酸素", "o": ["二酸化炭素", "窒素", "水素", "水蒸気"]}, {"q": "調べたい条件を1つだけ変え、それ以外を同じにして行う実験を【　？　】という。", "a": "対照実験", "o": ["再現実験", "予備実験", "比較観察"]}, {"q": "BTB溶液は、酸性で【　？　】色、中性で（　　）色、アルカリ性で（　　）色を示す。", "a": "黄", "o": ["緑", "青", "赤", "紫"]}, {"q": "BTB溶液は、酸性で（　　）色、中性で【　？　】色、アルカリ性で（　　）色を示す。", "a": "緑", "o": ["黄", "青", "赤", "紫"]}, {"q": "BTB溶液は、酸性で（　　）色、中性で（　　）色、アルカリ性で【　？　】色を示す。", "a": "青", "o": ["黄", "緑", "赤", "紫"]}, {"q": "葉の表皮にある、【　？　】に囲まれたすきまを気孔という。", "a": "孔辺細胞", "o": ["表皮細胞", "葉緑体", "根毛", "維管束"]}, {"q": "葉の表皮にある、孔辺細胞に囲まれたすきまを【　？　】という。", "a": "気孔", "o": ["葉脈", "道管", "師管", "根毛"]}, {"q": "植物の呼吸は【　？　】行われ、光合成は昼だけ行われる。昼は、光合成で出入りする気体の量の方が呼吸よりも多い。", "a": "昼も夜も", "o": ["昼だけ", "夜だけ", "光が当たるときだけ"]}, {"q": "植物の呼吸は昼も夜も行われ、光合成は【　？　】だけ行われる。昼は、光合成で出入りする気体の量の方が呼吸よりも多い。", "a": "昼", "o": ["夜", "夕方", "雨の日"]}, {"q": "植物の呼吸は昼も夜も行われ、光合成は昼だけ行われる。昼は、光合成で出入りする気体の量の方が呼吸よりも【　？　】。", "a": "多い", "o": ["少ない", "等しい", "ごくわずか"]}], "qa": [{"t": "ふ入りの葉と光合成", "lead": "ふ入りの葉の一部をアルミニウムはくでおおって一晩置き、翌日じゅうぶんに光に当てた。その後、葉を脱色してヨウ素液にひたした。葉の4つの部分は、ア＝緑色で光が当たった部分、イ＝白色（ふ）で光が当たった部分、ウ＝緑色でおおわれていた部分、エ＝白色でおおわれていた部分である。", "n": 1, "q": "青紫色に変わったのはア〜エのどれか。", "a": "ア"}, {"t": "ふ入りの葉と光合成", "lead": "ふ入りの葉の一部をアルミニウムはくでおおって一晩置き、翌日じゅうぶんに光に当てた。その後、葉を脱色してヨウ素液にひたした。葉の4つの部分は、ア＝緑色で光が当たった部分、イ＝白色（ふ）で光が当たった部分、ウ＝緑色でおおわれていた部分、エ＝白色でおおわれていた部分である。", "n": 2, "q": "アとイの結果を比べてわかることを書け。", "a": "光合成は葉緑体のある部分で行われる。"}, {"t": "ふ入りの葉と光合成", "lead": "ふ入りの葉の一部をアルミニウムはくでおおって一晩置き、翌日じゅうぶんに光に当てた。その後、葉を脱色してヨウ素液にひたした。葉の4つの部分は、ア＝緑色で光が当たった部分、イ＝白色（ふ）で光が当たった部分、ウ＝緑色でおおわれていた部分、エ＝白色でおおわれていた部分である。", "n": 3, "q": "アとウの結果を比べてわかることを書け。", "a": "光合成には光が必要である。"}, {"t": "ふ入りの葉と光合成", "lead": "ふ入りの葉の一部をアルミニウムはくでおおって一晩置き、翌日じゅうぶんに光に当てた。その後、葉を脱色してヨウ素液にひたした。葉の4つの部分は、ア＝緑色で光が当たった部分、イ＝白色（ふ）で光が当たった部分、ウ＝緑色でおおわれていた部分、エ＝白色でおおわれていた部分である。", "n": 4, "q": "脱色に使う液体は何か。", "a": "エタノール"}, {"t": "ふ入りの葉と光合成", "lead": "ふ入りの葉の一部をアルミニウムはくでおおって一晩置き、翌日じゅうぶんに光に当てた。その後、葉を脱色してヨウ素液にひたした。葉の4つの部分は、ア＝緑色で光が当たった部分、イ＝白色（ふ）で光が当たった部分、ウ＝緑色でおおわれていた部分、エ＝白色でおおわれていた部分である。", "n": 5, "q": "(4)の液体を火で直接加熱しないのはなぜか。", "a": "エタノールは引火しやすいから。"}, {"t": "ふ入りの葉と光合成", "lead": "ふ入りの葉の一部をアルミニウムはくでおおって一晩置き、翌日じゅうぶんに光に当てた。その後、葉を脱色してヨウ素液にひたした。葉の4つの部分は、ア＝緑色で光が当たった部分、イ＝白色（ふ）で光が当たった部分、ウ＝緑色でおおわれていた部分、エ＝白色でおおわれていた部分である。", "n": 6, "q": "脱色するのは何のためか。", "a": "ヨウ素液による色の変化を見やすくするため。"}, {"t": "水草の細胞と発生する気体", "lead": "明るいところに置いたオオカナダモ（A）と、アルミニウムはくでおおって光を当てなかったオオカナダモ（B）の葉をとり、熱湯につけてからあたためたエタノールにひたし、水洗いしてヨウ素液をつけ、顕微鏡で観察した。", "n": 1, "q": "処理する前の葉の細胞に見られる緑色の粒は何か。", "a": "葉緑体"}, {"t": "水草の細胞と発生する気体", "lead": "明るいところに置いたオオカナダモ（A）と、アルミニウムはくでおおって光を当てなかったオオカナダモ（B）の葉をとり、熱湯につけてからあたためたエタノールにひたし、水洗いしてヨウ素液をつけ、顕微鏡で観察した。", "n": 2, "q": "粒が青紫色に染まって見えたのはA・Bのどちらか。", "a": "A"}, {"t": "水草の細胞と発生する気体", "lead": "明るいところに置いたオオカナダモ（A）と、アルミニウムはくでおおって光を当てなかったオオカナダモ（B）の葉をとり、熱湯につけてからあたためたエタノールにひたし、水洗いしてヨウ素液をつけ、顕微鏡で観察した。", "n": 3, "q": "この観察から、光合成は細胞のどこで行われるとわかるか。", "a": "葉緑体"}, {"t": "水草の細胞と発生する気体", "lead": "明るいところに置いたオオカナダモ（A）と、アルミニウムはくでおおって光を当てなかったオオカナダモ（B）の葉をとり、熱湯につけてからあたためたエタノールにひたし、水洗いしてヨウ素液をつけ、顕微鏡で観察した。", "n": 4, "q": "光を当てたオオカナダモから出た泡を集め、火のついた線香を入れるとどうなるか。", "a": "炎を上げて激しく燃える。"}, {"t": "水草の細胞と発生する気体", "lead": "明るいところに置いたオオカナダモ（A）と、アルミニウムはくでおおって光を当てなかったオオカナダモ（B）の葉をとり、熱湯につけてからあたためたエタノールにひたし、水洗いしてヨウ素液をつけ、顕微鏡で観察した。", "n": 5, "q": "(4)から、出てきた気体は何とわかるか。", "a": "酸素"}, {"t": "条件の整理", "lead": "葉を入れた試験管A・Bと、何も入れない試験管Cに息をふきこんでゴム栓をした。Bだけアルミニウムはくを巻き、3本に30分間光を当てたあと、石灰水を入れてよくふった。", "n": 1, "q": "石灰水が白くにごらなかったのはどれか。", "a": "A"}, {"t": "条件の整理", "lead": "葉を入れた試験管A・Bと、何も入れない試験管Cに息をふきこんでゴム栓をした。Bだけアルミニウムはくを巻き、3本に30分間光を当てたあと、石灰水を入れてよくふった。", "n": 2, "q": "(1)で減少した気体は何か。", "a": "二酸化炭素"}, {"t": "条件の整理", "lead": "葉を入れた試験管A・Bと、何も入れない試験管Cに息をふきこんでゴム栓をした。Bだけアルミニウムはくを巻き、3本に30分間光を当てたあと、石灰水を入れてよくふった。", "n": 3, "q": "(2)が減少したのは、光が当たったためであることを確かめるには、どれとどれを比べるか。", "a": "A と B"}, {"t": "光合成と二酸化炭素（BTB溶液）", "lead": "青色のBTB溶液に息をふきこんで緑色にし、4本の試験管に入れた。Aは水草を入れて光を当てる。Bは水草を入れずに光を当てる。Cは水草を入れてアルミニウムはくを巻く。Dは水草を入れずにアルミニウムはくを巻く。すべてゴム栓をして30分間光を当てた。", "n": 1, "q": "AのBTB溶液は何色になるか。", "a": "青色"}, {"t": "光合成と二酸化炭素（BTB溶液）", "lead": "青色のBTB溶液に息をふきこんで緑色にし、4本の試験管に入れた。Aは水草を入れて光を当てる。Bは水草を入れずに光を当てる。Cは水草を入れてアルミニウムはくを巻く。Dは水草を入れずにアルミニウムはくを巻く。すべてゴム栓をして30分間光を当てた。", "n": 2, "q": "Aでは、二酸化炭素はふえたか、減少したか。", "a": "減少した"}, {"t": "光合成と二酸化炭素（BTB溶液）", "lead": "青色のBTB溶液に息をふきこんで緑色にし、4本の試験管に入れた。Aは水草を入れて光を当てる。Bは水草を入れずに光を当てる。Cは水草を入れてアルミニウムはくを巻く。Dは水草を入れずにアルミニウムはくを巻く。すべてゴム栓をして30分間光を当てた。", "n": 3, "q": "Aの水草が行った、(2)の原因となるはたらきは何か。", "a": "光合成"}, {"t": "光合成と二酸化炭素（BTB溶液）", "lead": "青色のBTB溶液に息をふきこんで緑色にし、4本の試験管に入れた。Aは水草を入れて光を当てる。Bは水草を入れずに光を当てる。Cは水草を入れてアルミニウムはくを巻く。Dは水草を入れずにアルミニウムはくを巻く。すべてゴム栓をして30分間光を当てた。", "n": 4, "q": "CのBTB溶液は何色になるか。", "a": "黄色"}, {"t": "光合成と二酸化炭素（BTB溶液）", "lead": "青色のBTB溶液に息をふきこんで緑色にし、4本の試験管に入れた。Aは水草を入れて光を当てる。Bは水草を入れずに光を当てる。Cは水草を入れてアルミニウムはくを巻く。Dは水草を入れずにアルミニウムはくを巻く。すべてゴム栓をして30分間光を当てた。", "n": 5, "q": "Cで二酸化炭素がふえたのは、何というはたらきによるか。", "a": "呼吸"}, {"t": "光合成と二酸化炭素（BTB溶液）", "lead": "青色のBTB溶液に息をふきこんで緑色にし、4本の試験管に入れた。Aは水草を入れて光を当てる。Bは水草を入れずに光を当てる。Cは水草を入れてアルミニウムはくを巻く。Dは水草を入れずにアルミニウムはくを巻く。すべてゴム栓をして30分間光を当てた。", "n": 6, "q": "AとBの結果のちがいからわかることを、「二酸化炭素」「植物」を使って書け。", "a": "植物に光が当たると、二酸化炭素が吸収される。"}, {"t": "光合成と二酸化炭素（BTB溶液）", "lead": "青色のBTB溶液に息をふきこんで緑色にし、4本の試験管に入れた。Aは水草を入れて光を当てる。Bは水草を入れずに光を当てる。Cは水草を入れてアルミニウムはくを巻く。Dは水草を入れずにアルミニウムはくを巻く。すべてゴム栓をして30分間光を当てた。", "n": 7, "q": "B、Dのような試験管を用意して比べる実験を何というか。", "a": "対照実験"}, {"t": "植物の呼吸（石灰水）", "lead": "3つのポリエチレンのふくろを用意した。Aは葉を入れて明るいところに、Bは葉を入れて暗いところに、Cは空気だけを入れて暗いところに置いた。2〜3時間後、それぞれのふくろの中の空気を石灰水に通した。", "n": 1, "q": "石灰水が白くにごったのはA〜Cのどれか。", "a": "B"}, {"t": "植物の呼吸（石灰水）", "lead": "3つのポリエチレンのふくろを用意した。Aは葉を入れて明るいところに、Bは葉を入れて暗いところに、Cは空気だけを入れて暗いところに置いた。2〜3時間後、それぞれのふくろの中の空気を石灰水に通した。", "n": 2, "q": "(1)のふくろの中でふえた気体は何か。", "a": "二酸化炭素"}, {"t": "植物の呼吸（石灰水）", "lead": "3つのポリエチレンのふくろを用意した。Aは葉を入れて明るいところに、Bは葉を入れて暗いところに、Cは空気だけを入れて暗いところに置いた。2〜3時間後、それぞれのふくろの中の空気を石灰水に通した。", "n": 3, "q": "(2)がふえたのは、植物の何というはたらきによるか。", "a": "呼吸"}, {"t": "植物の呼吸（石灰水）", "lead": "3つのポリエチレンのふくろを用意した。Aは葉を入れて明るいところに、Bは葉を入れて暗いところに、Cは空気だけを入れて暗いところに置いた。2〜3時間後、それぞれのふくろの中の空気を石灰水に通した。", "n": 4, "q": "空気だけのCを用意したのは何のためか。", "a": "石灰水の変化が植物のはたらきによることを確かめるため。"}, {"t": "植物の呼吸（石灰水）", "lead": "3つのポリエチレンのふくろを用意した。Aは葉を入れて明るいところに、Bは葉を入れて暗いところに、Cは空気だけを入れて暗いところに置いた。2〜3時間後、それぞれのふくろの中の空気を石灰水に通した。", "n": 5, "q": "Aで、呼吸で放出する二酸化炭素の量をx、光合成で吸収する量をyとする。x と y の関係を不等号で表せ。", "a": "x ＜ y"}, {"t": "植物の呼吸（石灰水）", "lead": "3つのポリエチレンのふくろを用意した。Aは葉を入れて明るいところに、Bは葉を入れて暗いところに、Cは空気だけを入れて暗いところに置いた。2〜3時間後、それぞれのふくろの中の空気を石灰水に通した。", "n": 6, "q": "晴れた日の昼、植物は全体として何を吸収し、何を出しているように見えるか。", "a": "二酸化炭素を吸収し、酸素を出しているように見える。"}, {"t": "植物の呼吸（石灰水）", "lead": "3つのポリエチレンのふくろを用意した。Aは葉を入れて明るいところに、Bは葉を入れて暗いところに、Cは空気だけを入れて暗いところに置いた。2〜3時間後、それぞれのふくろの中の空気を石灰水に通した。", "n": 7, "q": "呼吸が行われるのは「昼のみ・夜のみ・昼と夜」のどれか。", "a": "昼と夜"}, {"t": "植物の呼吸（石灰水）", "lead": "3つのポリエチレンのふくろを用意した。Aは葉を入れて明るいところに、Bは葉を入れて暗いところに、Cは空気だけを入れて暗いところに置いた。2〜3時間後、それぞれのふくろの中の空気を石灰水に通した。", "n": 8, "q": "光合成が行われるのは(7)の3つのうちどれか。", "a": "昼のみ"}]}, {"no": "2", "ttl": "蒸散と水の通り道", "ch": "第2章 植物のからだのつくりとはたらき", "sum": "\n<h2>吸水と蒸散<\/h2>\n<ul>\n<li><b class=g>吸水<\/b>…植物が根から水を吸い上げること。<\/li>\n<li><b class=g>蒸散<\/b>…吸い上げた水が、水蒸気となって植物のからだから出ていくこと。主に<b class=g>葉<\/b>の<b class=g>気孔<\/b>で行われる。<\/li>\n<li>蒸散がさかんになると吸水もさかんになる（蒸散は吸水の主な原動力）。<\/li>\n<li>蒸散がさかんなのは、<b class=b>気孔が開いているとき<\/b>・<b class=b>光が当たっているとき<\/b>（昼）。<\/li>\n<li>葉に<b class=g>ワセリン<\/b>をぬる → 気孔がふさがれ、その部分からは蒸散できない。<\/li>\n<\/ul>\n<table class=t><tr><th>枝<\/th><th>処理<\/th><th>蒸散できる部分<\/th><th>水の減少<\/th><\/tr>\n<tr><td>A<\/td><td>何もしない<\/td><td>葉の表・葉の裏・茎<\/td><td>27 mm<\/td><\/tr>\n<tr><td>B<\/td><td>葉の裏にワセリン<\/td><td>葉の表・茎<\/td><td>5 mm<\/td><\/tr>\n<tr><td>C<\/td><td>葉の表にワセリン<\/td><td>葉の裏・茎<\/td><td>10 mm<\/td><\/tr>\n<tr><td>D<\/td><td>葉を全部とる<\/td><td>茎だけ<\/td><td>ほぼ 0 mm<\/td><\/tr><\/table>\n<ul><li>BとCを比べる → 裏をあけておいたCの方が多い → 気孔は葉の<b class=g>裏側<\/b>に多い。<\/li>\n<li>AとDを比べる → 葉で蒸散が行われると吸水が起こる。<\/li><\/ul>\n<div class=box><b>計算の型<\/b>　ぬらない＝表＋裏＋葉以外　／　表にぬる＝裏＋葉以外　／　裏にぬる＝表＋葉以外<br>\n<span class=small>例：ぬらない3.7 g、表にぬる2.4 g、裏にぬる1.4 g、葉以外0.1 g → 裏＝2.4−0.1＝2.3 g、表＝1.4−0.1＝1.3 g<\/span><\/div>\n<h2>水や養分の通り道<\/h2>\n<table class=t><tr><th><\/th><th>通るもの<\/th><th>葉での位置<\/th><th>茎での位置<\/th><\/tr>\n<tr><th>道管<\/th><td>根から吸収した水、水にとけた肥料分<\/td><td>表側<\/td><td>内側<\/td><\/tr>\n<tr><th>師管<\/th><td>葉でつくられた養分（水にとけやすい物質に変わって運ばれる）<\/td><td>裏側<\/td><td>外側<\/td><\/tr><\/table>\n<ul>\n<li><b class=g>維管束<\/b>…道管と師管の集まり。葉では<b class=g>葉脈<\/b>として見える。<\/li>\n<li>色水を吸わせると、<b class=g>道管<\/b>が染まる。<\/li>\n<li>茎の維管束：ヒマワリ（<b class=g>双子葉類<\/b>）＝輪の形に並ぶ／トウモロコシ（<b class=g>単子葉類<\/b>）＝全体に散らばる。<\/li>\n<li><b class=g>根毛<\/b>…根の先端近くにある細い毛のようなつくり。土とふれる<b class=b>表面積が大きく<\/b>なり、水などを効率よく吸収できる。<\/li>\n<li>葉が重なり合わないようについている → 多くの葉に光が当たり、光合成をさかんに行える。<\/li>\n<\/ul>\n", "fill": [{"q": "植物が根から水を吸い上げることを【　？　】、吸い上げた水が水蒸気となってからだの外へ出ていくことを（　　）という。", "a": "吸水", "o": ["蒸散", "光合成", "呼吸", "吸収"]}, {"q": "植物が根から水を吸い上げることを（　　）、吸い上げた水が水蒸気となってからだの外へ出ていくことを【　？　】という。", "a": "蒸散", "o": ["吸水", "光合成", "呼吸", "蒸発"]}, {"q": "蒸散は主に【　？　】にある気孔というすきまで行われる。気孔はふつう葉の裏側に多い。葉にワセリンをぬると、その部分からの蒸散をおさえることができる。", " 小腸のかべ）<\/td><td>小腸<\/td><td>あり<\/td><td>デンプン・タンパク質<\/td><\/tr><\/table>\n<div class=box>最終的にできる物質：デンプン → <b class=g>ブドウ糖<\/b>　／　タンパク質 → <b class=g>アミノ酸<\/b>　／　脂肪 → <b class=g>脂肪酸とモノグリセリド<\/b><\/div>\n<h2>だ液のはたらきを調べる実験<\/h2>\n<ul>\n<li>A＝デンプン溶液＋だ液、B＝デンプン溶液＋水。約<b class=b>40℃<\/b>の湯であたためる（体温に近い温度でだ液がよくはたらくから）。<\/li>\n<li>Bは<b class=g>対照実験<\/b>：デンプンの変化がだ液のはたらきによることを確かめるため。<\/li>\n<li>ベネジクト液は<b class=b>加熱<\/b>して反応を見る。<b class=g>沸騰石<\/b>を入れて突沸を防ぐ。<\/li>\n<\/ul>\n<table class=t><tr><th><\/th><th>ヨウ素液<\/th><th>ベネジクト液（加熱）<\/th><\/tr>\n<tr><th>デンプン＋だ液<\/th><td>変化なし（デンプンがない）<\/td><td><b class=g>赤褐色の沈殿<\/b>（麦芽糖などがある）<\/td><\/tr>\n<tr><th>デンプン＋水<\/th><td><b class=g>青紫色<\/b>（デンプンがある）<\/td><td>変化なし（麦芽糖などがない）<\/td><\/tr><\/table>\n<ul><li>結論：だ液は、デンプンを麦芽糖などに分解する。<\/li><\/ul>\n<h2>吸収<\/h2>\n<ul>\n<li><b class=g>吸収<\/b>…分解された物質などを体内にとりこむこと。小腸のかべのひだにある<b class=g>柔毛<\/b>で行われる。<\/li>\n<li>柔毛がたくさんある → 小腸の内側の<b class=b>表面積が大きく<\/b>なり、養分を効率よく吸収できる。<\/li>\n<li>ブドウ糖・アミノ酸 → 柔毛の<b class=g>毛細血管<\/b>へ → <b class=g>肝臓<\/b>へ。ブドウ糖の一部は肝臓でグリコーゲンに変えられ、たくわえられる。<\/li>\n<li>脂肪酸とモノグリセリド → 柔毛で吸収されたあと再び<b class=g>脂肪<\/b>になり、<b class=g>リンパ管<\/b>へ。<\/li>\n<li>水分は主に<b class=g>小腸<\/b>で、残りは<b class=g>大腸<\/b>で吸収される。<\/li>\n<\/ul>\n", "fill": [{"q": "食物を、からだに吸収されやすい物質に分解することを【　？　】という。口から肛門までつながる1本の管を消化管という。", "a": "消化", "o": ["吸収", "排出", "呼吸", "循環"]}, {"q": "食物を、からだに吸収されやすい物質に分解することを消化という。口から肛門までつながる1本の管を【　？　】という。", "a": "消化管", "o": ["気管", "血管", "リンパ管", "輸尿管"]}, {"q": "だ液などのように食物を分解するはたらきをもつ液を【　？　】といい、その中にふくまれて食物を分解するものを消化酵素という。", "a": "消化液", "o": ["血液", "組織液", "血しょう", "尿"]}, {"q": "だ液などのように食物を分解するはたらきをもつ液を消化液といい、その中にふくまれて食物を分解するものを【　？　】という。", "a": "消化酵素", "o": ["ヘモグロビン", "赤血球", "ブドウ糖", "アミノ酸"]}, {"q": "だ液にふくまれる消化酵素は【　？　】で、デンプンを麦芽糖などに分解する。胃液にふくまれる消化酵素は（　　）で、タンパク質を分解する。", "a": "アミラーゼ", "o": ["ペプシン", "リパーゼ", "ヘモグロビン", "トリプシン"]}, {"q": "だ液にふくまれる消化酵素はアミラーゼで、【　？　】を麦芽糖などに分解する。胃液にふくまれる消化酵素はペプシンで、（　　）を分解する。", "a": "デンプン", "o": ["タンパク質", "脂肪", "アミノ酸"]}, {"q": "だ液にふくまれる消化酵素は（　　）で、デンプンを麦芽糖などに分解する。胃液にふくまれる消化酵素は【　？　】で、タンパク質を分解する。", "a": "ペプシン", "o": ["アミラーゼ", "リパーゼ", "ヘモグロビン", "トリプシン"]}, {"q": "だ液にふくまれる消化酵素はアミラーゼで、（　　）を麦芽糖などに分解する。胃液にふくまれる消化酵素はペプシンで、【　？　】を分解する。", "a": "タンパク質", "o": ["デンプン", "脂肪", "ブドウ糖"]}, {"q": "消化酵素をふくまないが脂肪の分解を助ける消化液は【　？　】である。これは肝臓でつくられ、胆のうから出される。", "a": "胆汁", "o": ["だ液", "胃液", "すい液"]}, {"q": "消化酵素をふくまないが脂肪の分解を助ける消化液は胆汁である。これは【　？　】でつくられ、胆のうから出される。", "a": "肝臓", "o": ["腎臓", "すい臓", "胃", "小腸", "心臓"]}, {"q": "消化酵素をふくまないが脂肪の分解を助ける消化液は胆汁である。これは肝臓でつくられ、【　？　】から出される。", "a": "胆のう", "o": ["すい臓", "胃", "ぼうこう", "腎臓"]}, {"q": "デンプンは最終的に【　？　】に、タンパク質は（　　）に、脂肪は脂肪酸とモノグリセリドに分解される。", "a": "ブドウ糖", "o": ["アミノ酸", "麦芽糖", "脂肪酸", "デンプン"]}, {"q": "デンプンは最終的に（　　）に、タンパク質は【　？　】に、脂肪は脂肪酸とモノグリセリドに分解される。", "a": "アミノ酸", "o": ["ブドウ糖", "麦芽糖", "脂肪酸", "尿素"]}, {"q": "デンプンは最終的に（　　）に、タンパク質は（　　）に、脂肪は脂肪酸と【　？　】に分解される。", "a": "モノグリセリド", "o": ["アミノ酸", "ブドウ糖", "グリコーゲン", "麦芽糖"]}, {"q": "ヨウ素液はデンプンがあると【　？　】色に変わる。ベネジクト液は、麦芽糖などがあると加熱したときに（　　）色の沈殿ができる。", "a": "青紫", "o": ["赤褐", "黄", "白", "緑"]}, {"q": "ヨウ素液はデンプンがあると（　　）色に変わる。ベネジクト液は、麦芽糖などがあると加熱したときに【　？　】色の沈殿ができる。", "a": "赤褐", "o": ["青紫", "黄", "白", "緑"]}, {"q": "分解された物質を体内にとりこむことを【　？　】という。小腸のかべのひだにある小さな突起を柔毛という。", "a": "吸収", "o": ["消化", "排出", "分解", "循環"]}, {"q": "分解された物質を体内にとりこむことを吸収という。小腸のかべのひだにある小さな突起を【　？　】という。", "a": "柔毛", "o": ["根毛", "肺胞", "気管支"]}, {"q": "ブドウ糖とアミノ酸は柔毛の【　？　】に入り、肝臓に運ばれる。脂肪酸とモノグリセリドは再び脂肪になって（　　）に入る。", "a": "毛細血管", "o": ["リンパ管", "動脈", "静脈", "気管"]}, {"q": "ブドウ糖とアミノ酸は柔毛の毛細血管に入り、【　？　】に運ばれる。脂肪酸とモノグリセリドは再び脂肪になってリンパ管に入る。", "a": "肝臓", "o": ["腎臓", "すい臓", "胃", "小腸", "心臓"]}, {"q": "ブドウ糖とアミノ酸は柔毛の毛細血管に入り、肝臓に運ばれる。脂肪酸とモノグリセリドは再び【　？　】になってリンパ管に入る。", "a": "脂肪", "o": ["デンプン", "タンパク質", "ブドウ糖", "アミノ酸"]}, {"q": "ブドウ糖とアミノ酸は柔毛の（　　）に入り、肝臓に運ばれる。脂肪酸とモノグリセリドは再び脂肪になって【　？　】に入る。", "a": "リンパ管", "o": ["毛細血管", "動脈", "静脈", "輸尿管"]}], "qa": [{"t": "だ液によるデンプンの変化", "lead": "試験管Aにデンプン溶液とだ液、試験管Bにデンプン溶液と水を入れ、約40℃の湯であたためた。その後、A・Bの液を半分ずつ別の試験管C・Dに分けた（C＝Aの液、D＝Bの液）。A・Bにはヨウ素液を入れ、C・Dにはベネジクト液を入れて加熱した。", "n": 1, "q": "約40℃の湯であたためるのはなぜか。", "a": "だ液は体温に近い温度でよくはたらくから。"}, {"t": "だ液によるデンプンの変化", "lead": "試験管Aにデンプン溶液とだ液、試験管Bにデンプン溶液と水を入れ、約40℃の湯であたためた。その後、A・Bの液を半分ずつ別の試験管C・Dに分けた（C＝Aの液、D＝Bの液）。A・Bにはヨウ素液を入れ、C・Dにはベネジクト液を入れて加熱した。", "n": 2, "q": "水を入れたBを用意したのはなぜか。", "a": "デンプンの変化がだ液のはたらきによることを確かめるため。"}, {"t": "だ液によるデンプンの変化", "lead": "試験管Aにデンプン溶液とだ液、試験管Bにデンプン溶液と水を入れ、約40℃の湯であたためた。その後、A・Bの液を半分ずつ別の試験管C・Dに分けた（C＝Aの液、D＝Bの液）。A・Bにはヨウ素液を入れ、C・Dにはベネジクト液を入れて加熱した。", "n": 3, "q": "ベネジクト液を入れた試験管を加熱するとき、突沸を防ぐために入れるものは何か。", "a": "沸騰石"}, {"t": "だ液によるデンプンの変化", "lead": "試験管Aにデンプン溶液とだ液、試験管Bにデンプン溶液と水を入れ、約40℃の湯であたためた。その後、A・Bの液を半分ずつ別の試験管C・Dに分けた（C＝Aの液、D＝Bの液）。A・Bにはヨウ素液を入れ、C・Dにはベネジクト液を入れて加熱した。", "n": 4, "q": "ヨウ素液で色が変化したのはA・Bのどちらか。", "a": "B"}, {"t": "だ液によるデンプンの変化", "lead": "試験管Aにデンプン溶液とだ液、試験管Bにデンプン溶液と水を入れ、約40℃の湯であたためた。その後、A・Bの液を半分ずつ別の試験管C・Dに分けた（C＝Aの液、D＝Bの液）。A・Bにはヨウ素液を入れ、C・Dにはベネジクト液を入れて加熱した。", "n": 5, "q": "(4)では何色に変化したか。", "a": "青紫色"}, {"t": "だ液によるデンプンの変化", "lead": "試験管Aにデンプン溶液とだ液、試験管Bにデンプン溶液と水を入れ、約40℃の湯であたためた。その後、A・Bの液を半分ずつ別の試験管C・Dに分けた（C＝Aの液、D＝Bの液）。A・Bにはヨウ素液を入れ、C・Dにはベネジクト液を入れて加熱した。", "n": 6, "q": "ベネジクト液で沈殿ができたのはC・Dのどちらか。", "a": "C"}, {"t": "だ液によるデンプンの変化", "lead": "試験管Aにデンプン溶液とだ液、試験管Bにデンプン溶液と水を入れ、約40℃の湯であたためた。その後、A・Bの液を半分ずつ別の試験管C・Dに分けた（C＝Aの液、D＝Bの液）。A・Bにはヨウ素液を入れ、C・Dにはベネジクト液を入れて加熱した。", "n": 7, "q": "(6)の沈殿は何色か。", "a": "赤褐色"}, {"t": "だ液によるデンプンの変化", "lead": "試験管Aにデンプン溶液とだ液、試験管Bにデンプン溶液と水を入れ、約40℃の湯であたためた。その後、A・Bの液を半分ずつ別の試験管C・Dに分けた（C＝Aの液、D＝Bの液）。A・Bにはヨウ素液を入れ、C・Dにはベネジクト液を入れて加熱した。", "n": 8, "q": "Aの結果からわかることを書け。", "a": "デンプンがなくなった。"}, {"t": "だ液によるデンプンの変化", "lead": "試験管Aにデンプン溶液とだ液、試験管Bにデンプン溶液と水を入れ、約40℃の湯であたためた。その後、A・Bの液を半分ずつ別の試験管C・Dに分けた（C＝Aの液、D＝Bの液）。A・Bにはヨウ素液を入れ、C・Dにはベネジクト液を入れて加熱した。", "n": 9, "q": "Cの結果からわかることを書け。", "a": "麦芽糖などができた。"}, {"t": "だ液によるデンプンの変化", "lead": "試験管Aにデンプン溶液とだ液、試験管Bにデンプン溶液と水を入れ、約40℃の湯であたためた。その後、A・Bの液を半分ずつ別の試験管C・Dに分けた（C＝Aの液、D＝Bの液）。A・Bにはヨウ素液を入れ、C・Dにはベネジクト液を入れて加熱した。", "n": 10, "q": "この実験から、だ液にはどのようなはたらきがあるとわかるか。「デンプン」を使って書け。", "a": "デンプンを麦芽糖などに分解するはたらき。"}, {"t": "消化液と消化酵素", "lead": "消化液について、次の問いに答えよ。", "n": 1, "q": "だ液にふくまれる消化酵素は何か。", "a": "アミラーゼ"}, {"t": "消化液と消化酵素", "lead": "消化液について、次の問いに答えよ。", "n": 2, "q": "胃液にふくまれる消化酵素は何か。", "a": "ペプシン"}, {"t": "消化液と消化酵素", "lead": "消化液について、次の問いに答えよ。", "n": 3, "q": "(2)が分解する物質は何か。", "a": "タンパク質"}, {"t": "消化液と消化酵素", "lead": "消化液について、次の問いに答えよ。", "n": 4, "q": "すい臓から出される消化液は何か。", "a": "すい液"}, {"t": "消化液と消化酵素", "lead": "消化液について、次の問いに答えよ。", "n": 5, "q": "消化酵素をふくまず、脂肪の分解を助ける消化液は何か。", "a": "胆汁"}, {"t": "消化液と消化酵素", "lead": "消化液について、次の問いに答えよ。", "n": 6, "q": "(5)をつくる器官は何か。", "a": "肝臓"}, {"t": "消化液と消化酵素", "lead": "消化液について、次の問いに答えよ。", "n": 7, "q": "(5)をためておき、出す器官は何か。", "a": "胆のう"}, {"t": "消化液と消化酵素", "lead": "消化液について、次の問いに答えよ。", "n": 8, "q": "タンパク質の分解に関係する消化酵素をふくむ消化液を、だ液・胃液・胆汁・すい液からすべて選べ。", "a": "胃液、すい液"}, {"t": "消化の流れと吸収", "lead": "食物の消化と吸収について、次の問いに答えよ。", "n": 1, "q": "口から肛門まで続く1本の長い管を何というか。", "a": "消化管"}, {"t": "消化の流れと吸収", "lead": "食物の消化と吸収について、次の問いに答えよ。", "n": 2, "q": "食物が通る順に並べよ。〔胃・大腸・食道・小腸〕", "a": "食道→胃→小腸→大腸"}, {"t": "消化の流れと吸収", "lead": "食物の消化と吸収について、次の問いに答えよ。", "n": 3, "q": "デンプンが最終的に分解されてできる物質は何か。", "a": "ブドウ糖"}, {"t": "消化の流れと吸収", "lead": "食物の消化と吸収について、次の問いに答えよ。", "n": 4, "q": "タンパク質が最終的に分解されてできる物質は何か。", "a": "アミノ酸"}, {"t": "消化の流れと吸収", "lead": "食物の消化と吸収について、次の問いに答えよ。", "n": 5, "q": "脂肪は、脂肪酸と何に分解されるか。", "a": "モノグリセリド"}, {"t": "消化の流れと吸収", "lead": "食物の消化と吸収について、次の問いに答えよ。", "n": 6, "q": "小腸のかべのひだにある小さな突起を何というか。", "a": "柔毛"}, {"t": "消化の流れと吸収", "lead": "食物の消化と吸収について、次の問いに答えよ。", "n": 7, "q": "(6)がたくさんあると、養分を効率よく吸収できるのはなぜか。「表面積」を使って書け。", "a": "小腸の内側の表面積が大きくなるから。"}, {"t": "消化の流れと吸収", "lead": "食物の消化と吸収について、次の問いに答えよ。", "n": 8, "q": "ブドウ糖とアミノ酸は、(6)の中の何という管に入るか。", "a": "毛細血管"}, {"t": "消化の流れと吸収", "lead": "食物の消化と吸収について、次の問いに答えよ。", "n": 9, "q": "ブドウ糖の一部をたくわえる器官は何か。", "a": "肝臓"}, {"t": "消化の流れと吸収", "lead": "食物の消化と吸収について、次の問いに答えよ。", "n": 10, "q": "脂肪酸とモノグリセリドは、吸収されたあと再び何になるか。", "a": "脂肪"}, {"t": "消化の流れと吸収", "lead": "食物の消化と吸収について、次の問いに答えよ。", "n": 11, "q": "(10)は何という管に入るか。", "a": "リンパ管"}, {"t": "消化の流れと吸収", "lead": "食物の消化と吸収について、次の問いに答えよ。", "n": 12, "q": "水分が吸収される器官を2つ書け。", "a": "小腸、大腸"}, {"t": "酵素のはたらきを確かめる実験", "lead": "「パイナップルにはタンパク質を分解する酵素がふくまれるが、加熱するとそのはたらきがなくなる」ことを確かめたい。タンパク質が主成分のゼラチンをとかした液を試験管A〜Cに入れ、Aには何も入れず、Bには加熱したパイナップルを入れて、冷やして固まるかどうかを調べる。", "n": 1, "q": "Cにはパイナップルをどのようにして入れればよいか。", "a": "加熱しないで入れる。"}, {"t": "酵素のはたらきを確かめる実験", "lead": "「パイナップルにはタンパク質を分解する酵素がふくまれるが、加熱するとそのはたらきがなくなる」ことを確かめたい。タンパク質が主成分のゼラチンをとかした液を試験管A〜Cに入れ、Aには何も入れず、Bには加熱したパイナップルを入れて、冷やして固まるかどうかを調べる。", "n": 2, "q": "パイナップル以外の条件をすべて同じにするのはなぜか。", "a": "結果のちがいがパイナップルによることを確かめるため。"}, {"t": "酵素のはたらきを確かめる実験", "lead": "「パイナップルにはタンパク質を分解する酵素がふくまれるが、加熱するとそのはたらきがなくなる」ことを確かめたい。タンパク質が主成分のゼラチンをとかした液を試験管A〜Cに入れ、Aには何も入れず、Bには加熱したパイナップルを入れて、冷やして固まるかどうかを調べる。", "n": 3, "q": "ゼラチンが固まらないと考えられるのはA〜Cのどれか。", "a": "C"}]}, {"no": "4", "ttl": "呼吸・血液の循環・排出", "ch": "第3章 動物のからだのつくりとはたらき", "sum": "\n<h2>呼吸<\/h2>\n<ul>\n<li><b class=g>細胞の呼吸<\/b>…全身の細胞で、<b class=b>酸素<\/b>を使って養分（有機物）からエネルギーをとり出すこと。二酸化炭素と水ができる。<\/li>\n<li>空気の通り道：鼻・口 → <b class=g>気管<\/b> → <b class=g>気管支<\/b> → <b class=g>肺胞<\/b>。肺胞のまわりを<b class=g>毛細血管<\/b>がとり囲む。<\/li>\n<li>肺胞では、酸素が血液にとりこまれ、二酸化炭素が血液から出される ＝ <b class=g>肺呼吸<\/b>。<\/li>\n<li>肺胞がたくさんある → 空気にふれる<b class=b>表面積が大きく<\/b>なり、気体の交換を効率よく行える。<\/li>\n<\/ul>\n<h2>心臓と血管<\/h2>\n<ul>\n<li>心臓は<b class=g>右心房・右心室・左心房・左心室<\/b>の4つの部屋。血液を送り出すポンプ。心房は血液がもどる部屋、心室は血液を送り出す部屋。<\/li>\n<\/ul>\n<table class=t><tr><th>動脈<\/th><td>心臓から送り出される血液が流れる。かべが厚い。<\/td><\/tr>\n<tr><th>静脈<\/th><td>心臓へもどる血液が流れる。ところどころに<b class=g>弁<\/b>があり、血液の逆流を防ぐ。<\/td><\/tr>\n<tr><th>毛細血管<\/th><td>組織に網の目のように張りめぐらされた細い血管。<\/td><\/tr><\/table>\n<table class=t><tr><th>体循環<\/th><td>心臓 → 肺以外の全身 → 心臓<\/td><th>肺循環<\/th><td>心臓 → 肺 → 心臓<\/td><\/tr>\n<tr><th>動脈血<\/th><td>酸素を多くふくむ血液<\/td><th>静脈血<\/th><td>二酸化炭素を多くふくむ血液<\/td><\/tr><\/table>\n<ul><li><b class=b>注意<\/b>：肺動脈には静脈血、肺静脈には動脈血が流れる。<\/li><\/ul>\n<h2>血液の成分<\/h2>\n<table class=t><tr><th>赤血球<\/th><td>中央がくぼんだ円盤形。<b class=g>ヘモグロビン<\/b>をふくみ、酸素を運ぶ。<\/td><\/tr>\n<tr><th>白血球<\/th><td>細菌などの異物を分解する。<\/td><\/tr>\n<tr><th>血小板<\/th><td>小さく不規則な形。出血したとき血液を固める。<\/td><\/tr>\n<tr><th>血しょう<\/th><td>液体。養分や不要な物質などを運ぶ。<\/td><\/tr><\/table>\n<ul>\n<li>ヘモグロビン：酸素の多いところでは酸素と<b class=b>結びつき<\/b>、酸素の少ないところでは酸素を<b class=b>はなす<\/b>。<\/li>\n<li><b class=g>組織液<\/b>…血しょうが毛細血管からしみ出て、細胞のまわりを満たしている液。血液と細胞の間で物質のやりとりのなかだちをする。<\/li>\n<\/ul>\n<h2>排出<\/h2>\n<ul>\n<li>細胞でできた有害な<b class=g>アンモニア<\/b> → <b class=g>肝臓<\/b>で無害な<b class=g>尿素<\/b>に変える → <b class=g>腎臓<\/b>で血液からこし出す → <b class=g>輸尿管<\/b> → <b class=g>ぼうこう<\/b>に一時ためる → <b class=g>尿<\/b>として排出。<\/li>\n<\/ul>\n<div class=box><b>血液の特徴<\/b>　食後に養分が最も多い＝小腸から肝臓へ向かう血液　／　酸素が最も多い＝肺から心臓へもどる血液（肺静脈）　／　尿素が最も少ない＝腎臓を通ったあとの血液<\/div>\n", "fill": [{"q": "全身の細胞で、酸素を使って養分からエネルギーをとり出すことを【　？　】という。このとき二酸化炭素と水ができる。", "a": "細胞の呼吸", "o": ["肺呼吸", "光合成", "消化", "排出"]}, {"q": "全身の細胞で、酸素を使って養分からエネルギーをとり出すことを細胞の呼吸という。このとき【　？　】と水ができる。", "a": "二酸化炭素", "o": ["酸素", "窒素", "水素", "水蒸気"]}, {"q": "鼻や口から吸いこまれた空気は【　？　】を通り、枝分かれした気管支を通って、その先にある小さなふくろの（　　）に入る。ここで血液中にとりこまれる気体は酸素である。", "a": "気管", "o": ["食道", "血管", "肺胞", "輸尿管"]}, {"q": "鼻や口から吸いこまれた空気は気管を通り、枝分かれした【　？　】を通って、その先にある小さなふくろの肺胞に入る。ここで血液中にとりこまれる気体は酸素である。", "a": "気管支", "o": ["食道", "毛細血管", "心房", "柔毛"]}, {"q": "鼻や口から吸いこまれた空気は気管を通り、枝分かれした気管支を通って、その先にある小さなふくろの【　？　】に入る。ここで血液中にとりこまれる気体は酸素である。", "a": "肺胞", "o": ["柔毛", "心房", "赤血球", "気孔"]}, {"q": "鼻や口から吸いこまれた空気は気管を通り、枝分かれした気管支を通って、その先にある小さなふくろの肺胞に入る。ここで血液中にとりこまれる気体は【　？　】である。", "a": "酸素", "o": ["二酸化炭素", "窒素", "水素", "水蒸気"]}, {"q": "心臓から送り出される血液が流れる血管を【　？　】、心臓へもどる血液が流れる血管を（　　）という。静脈には血液の逆流を防ぐ弁がある。", "a": "動脈", "o": ["静脈", "毛細血管", "リンパ管"]}, {"q": "心臓から送り出される血液が流れる血管を（　　）、心臓へもどる血液が流れる血管を【　？　】という。静脈には血液の逆流を防ぐ弁がある。", "a": "静脈", "o": ["動脈", "毛細血管", "リンパ管"]}, {"q": "心臓から送り出される血液が流れる血管を動脈、心臓へもどる血液が流れる血管を静脈という。静脈には血液の逆流を防ぐ【　？　】がある。", "a": "弁", "o": ["筋肉", "関節", "柔毛", "膜"]}, {"q": "心臓から肺以外の全身を通って心臓にもどる血液の流れを【　？　】、心臓から肺を通って心臓にもどる流れを（　　）という。", "a": "体循環", "o": ["肺循環", "動脈血", "静脈血"]}, {"q": "心臓から肺以外の全身を通って心臓にもどる血液の流れを（　　）、心臓から肺を通って心臓にもどる流れを【　？　】という。", "a": "肺循環", "o": ["体循環", "動脈血", "静脈血"]}, {"q": "酸素を多くふくむ血液を【　？　】、二酸化炭素を多くふくむ血液を（　　）という。", "a": "動脈血", "o": ["静脈血", "血しょう", "組織液"]}, {"q": "酸素を多くふくむ血液を（　　）、二酸化炭素を多くふくむ血液を【　？　】という。", "a": "静脈血", "o": ["動脈血", "血しょう", "組織液"]}, {"q": "酸素を運ぶ血液の成分は【　？　】で、ヘモグロビンという物質をふくむ。細菌などを分解する成分は（　　）、出血したとき血液を固める成分は（　　）、液体の成分は（　　）である。", "a": "赤血球", "o": ["組織液", "尿素", "グリコーゲン", "白血球", "血小板", "血しょう"]}, {"q": "酸素を運ぶ血液の成分は赤血球で、【　？　】という物質をふくむ。細菌などを分解する成分は白血球、出血したとき血液を固める成分は血小板、液体の成分は血しょうである。", "a": "ヘモグロビン", "o": ["アミラーゼ", "ペプシン", "グリコーゲン", "尿素"]}, {"q": "酸素を運ぶ血液の成分は（　　）で、ヘモグロビンという物質をふくむ。細菌などを分解する成分は【　？　】、出血したとき血液を固める成分は（　　）、液体の成分は（　　）である。", "a": "白血球", "o": ["組織液", "尿素", "グリコーゲン", "赤血球", "血小板", "血しょう"]}, {"q": "酸素を運ぶ血液の成分は（　　）で、ヘモグロビンという物質をふくむ。細菌などを分解する成分は（　　）、出血したとき血液を固める成分は【　？　】、液体の成分は（　　）である。", "a": "血小板", "o": ["組織液", "尿素", "グリコーゲン", "赤血球", "白血球", "血しょう"]}, {"q": "酸素を運ぶ血液の成分は（　　）で、ヘモグロビンという物質をふくむ。細菌などを分解する成分は（　　）、出血したとき血液を固める成分は（　　）、液体の成分は【　？　】である。", "a": "血しょう", "o": ["組織液", "胆汁", "尿", "赤血球", "白血球", "血小板"]}, {"q": "血しょうが毛細血管からしみ出て、細胞のまわりを満たしている液を【　？　】という。", "a": "組織液", "o": ["消化液", "尿", "リンパ管", "胆汁"]}, {"q": "有害なアンモニアは【　？　】で無害な尿素に変えられ、（　　）で血液からとり除かれて、尿として排出される。", "a": "肝臓", "o": ["腎臓", "すい臓", "胃", "小腸", "心臓"]}, {"q": "有害なアンモニアは肝臓で無害な【　？　】に変えられ、腎臓で血液からとり除かれて、尿として排出される。", "a": "尿素", "o": ["ブドウ糖", "アミノ酸", "グリコーゲン", "二酸化炭素"]}, {"q": "有害なアンモニアは（　　）で無害な尿素に変えられ、【　？　】で血液からとり除かれて、尿として排出される。", "a": "腎臓", "o": ["肝臓", "ぼうこう", "すい臓", "心臓"]}, {"q": "有害なアンモニアは肝臓で無害な尿素に変えられ、腎臓で血液からとり除かれて、【　？　】として排出される。", "a": "尿", "o": ["汗", "胆汁", "組織液", "血しょう"]}], "qa": [{"t": "呼吸のしくみ", "lead": "ヒトの呼吸について、次の問いに答えよ。", "n": 1, "q": "エネルギーをとり出すもとになる養分は、有機物・無機物のどちらか。", "a": "有機物"}, {"t": "呼吸のしくみ", "lead": "ヒトの呼吸について、次の問いに答えよ。", "n": 2, "q": "エネルギーをとり出すのに必要な気体は何か。", "a": "酸素"}, {"t": "呼吸のしくみ", "lead": "ヒトの呼吸について、次の問いに答えよ。", "n": 3, "q": "エネルギーをとり出すはたらきは、全身のどこで行われるか。", "a": "細胞"}, {"t": "呼吸のしくみ", "lead": "ヒトの呼吸について、次の問いに答えよ。", "n": 4, "q": "気管が枝分かれした管を何というか。", "a": "気管支"}, {"t": "呼吸のしくみ", "lead": "ヒトの呼吸について、次の問いに答えよ。", "n": 5, "q": "(4)の先にある小さなふくろを何というか。", "a": "肺胞"}, {"t": "呼吸のしくみ", "lead": "ヒトの呼吸について、次の問いに答えよ。", "n": 6, "q": "(5)のまわりをとり囲む細い血管を何というか。", "a": "毛細血管"}, {"t": "呼吸のしくみ", "lead": "ヒトの呼吸について、次の問いに答えよ。", "n": 7, "q": "(5)で、血液から出される気体は何か。", "a": "二酸化炭素"}, {"t": "呼吸のしくみ", "lead": "ヒトの呼吸について、次の問いに答えよ。", "n": 8, "q": "肺で酸素をとりこみ、二酸化炭素を出すはたらきを何というか。", "a": "肺呼吸"}, {"t": "呼吸のしくみ", "lead": "ヒトの呼吸について、次の問いに答えよ。", "n": 9, "q": "(5)がたくさんあると、気体の交換を効率よく行えるのはなぜか。「表面積」を使って書け。", "a": "空気にふれる表面積が大きくなるから。"}, {"t": "心臓と血液の循環", "lead": "ヒトの心臓と血管について、次の問いに答えよ。", "n": 1, "q": "血液を全身に送り出すポンプの役割をしている器官は何か。", "a": "心臓"}, {"t": "心臓と血液の循環", "lead": "ヒトの心臓と血管について、次の問いに答えよ。", "n": 2, "q": "全身からもどった血液が最初に入る心臓の部屋はどこか。", "a": "右心房"}, {"t": "心臓と血液の循環", "lead": "ヒトの心臓と血管について、次の問いに答えよ。", "n": 3, "q": "全身へ血液を送り出す心臓の部屋はどこか。", "a": "左心室"}, {"t": "心臓と血液の循環", "lead": "ヒトの心臓と血管について、次の問いに答えよ。", "n": 4, "q": "かべがより厚い血管は、動脈・静脈のどちらか。", "a": "動脈"}, {"t": "心臓と血液の循環", "lead": "ヒトの心臓と血管について、次の問いに答えよ。", "n": 5, "q": "弁がある血管は、動脈・静脈のどちらか。", "a": "静脈"}, {"t": "心臓と血液の循環", "lead": "ヒトの心臓と血管について、次の問いに答えよ。", "n": 6, "q": "静脈の弁はどのようなはたらきをするか。", "a": "血液が逆流するのを防ぐはたらき。"}, {"t": "心臓と血液の循環", "lead": "ヒトの心臓と血管について、次の問いに答えよ。", "n": 7, "q": "心臓から肺以外の全身を通って心臓にもどる流れを何というか。", "a": "体循環"}, {"t": "心臓と血液の循環", "lead": "ヒトの心臓と血管について、次の問いに答えよ。", "n": 8, "q": "心臓から肺、肺から心臓という流れを何というか。", "a": "肺循環"}, {"t": "心臓と血液の循環", "lead": "ヒトの心臓と血管について、次の問いに答えよ。", "n": 9, "q": "動脈血が流れているのは、肺動脈・肺静脈のどちらか。", "a": "肺静脈"}, {"t": "心臓と血液の循環", "lead": "ヒトの心臓と血管について、次の問いに答えよ。", "n": 10, "q": "運動前は拍動数が1分間に70回、1回の拍動で送り出す血液は70 cm³、運動後は190回、120 cm³だった。1分間に送り出す血液の量は、運動後は運動前の何倍か。小数第2位を四捨五入せよ。", "a": "4.7倍"}, {"t": "血液の成分とはたらき", "lead": "血液について、次の問いに答えよ。", "n": 1, "q": "中央がくぼんだ円盤形で、酸素を運ぶ成分は何か。", "a": "赤血球"}, {"t": "血液の成分とはたらき", "lead": "血液について、次の問いに答えよ。", "n": 2, "q": "(1)にふくまれ、酸素と結びつく物質は何か。", "a": "ヘモグロビン"}, {"t": "血液の成分とはたらき", "lead": "血液について、次の問いに答えよ。", "n": 3, "q": "細菌などの異物を分解する成分は何か。", "a": "白血球"}, {"t": "血液の成分とはたらき", "lead": "血液について、次の問いに答えよ。", "n": 4, "q": "出血したとき、血液を固める成分は何か。", "a": "血小板"}, {"t": "血液の成分とはたらき", "lead": "血液について、次の問いに答えよ。", "n": 5, "q": "養分や不要な物質を運ぶ、液体の成分は何か。", "a": "血しょう"}, {"t": "血液の成分とはたらき", "lead": "血液について、次の問いに答えよ。", "n": 6, "q": "(5)が毛細血管からしみ出て、細胞のまわりを満たしている液を何というか。", "a": "組織液"}, {"t": "血液の成分とはたらき", "lead": "血液について、次の問いに答えよ。", "n": 7, "q": "(6)を通して、血液から細胞にわたされる気体は何か。", "a": "酸素"}, {"t": "血液の成分とはたらき", "lead": "血液について、次の問いに答えよ。", "n": 8, "q": "(6)を通して、細胞から血液にわたされる気体は何か。", "a": "二酸化炭素"}, {"t": "血液の成分とはたらき", "lead": "血液について、次の問いに答えよ。", "n": 9, "q": "赤血球が酸素を運べるのは、ヘモグロビンにどのような性質があるからか。「酸素」を使って書け。", "a": "酸素の多いところでは酸素と結びつき、少ないところでは酸素をはなす性質。"}, {"t": "排出のしくみ", "lead": "不要な物質の排出について、次の問いに答えよ。", "n": 1, "q": "細胞の活動でできる有害な物質は何か。", "a": "アンモニア"}, {"t": "排出のしくみ", "lead": "不要な物質の排出について、次の問いに答えよ。", "n": 2, "q": "(1)は無害な何という物質に変えられるか。", "a": "尿素"}, {"t": "排出のしくみ", "lead": "不要な物質の排出について、次の問いに答えよ。", "n": 3, "q": "(1)を(2)に変える器官は何か。", "a": "肝臓"}, {"t": "排出のしくみ", "lead": "不要な物質の排出について、次の問いに答えよ。", "n": 4, "q": "血液中から(2)などをとり除く器官は何か。", "a": "腎臓"}, {"t": "排出のしくみ", "lead": "不要な物質の排出について、次の問いに答えよ。", "n": 5, "q": "(4)とぼうこうをつなぐ管を何というか。", "a": "輸尿管"}, {"t": "排出のしくみ", "lead": "不要な物質の排出について、次の問いに答えよ。", "n": 6, "q": "尿を一時的にためる器官は何か。", "a": "ぼうこう"}, {"t": "血液にふくまれる物質", "lead": "からだをめぐる血液について、次の問いに答えよ。", "n": 1, "q": "食後、ブドウ糖などの養分を最も多くふくむ血液は、どこからどこへ向かう血液か。", "a": "小腸から肝臓へ向かう血液"}, {"t": "血液にふくまれる物質", "lead": "からだをめぐる血液について、次の問いに答えよ。", "n": 2, "q": "酸素を最も多くふくむ血液は、どこからどこへ向かう血液か。", "a": "肺から心臓へ向かう血液"}, {"t": "血液にふくまれる物質", "lead": "からだをめぐる血液について、次の問いに答えよ。", "n": 3, "q": "尿素が最も少ない血液は、どの器官を通ったあとの血液か。", "a": "腎臓"}]}, {"no": "5", "ttl": "刺激と反応", "ch": "第4章 刺激と反応", "sum": "\n<h2>感覚器官<\/h2>\n<ul><li><b class=g>感覚器官<\/b>…外界からの刺激を受けとる器官（目・耳・鼻・舌・皮膚）。刺激は信号に変えられ、<b class=g>感覚神経<\/b>を通って脳に伝わる。<\/li><\/ul>\n<table class=t><tr><th rowspan=2>目<\/th><th>レンズ（水晶体）<\/th><td>光を屈折させ、網膜の上に像を結ぶ。<\/td><\/tr>\n<tr><th>網膜<\/th><td>像が結ばれ、光の刺激を受けとる細胞がある。<\/td><\/tr>\n<tr><th rowspan=3>耳<\/th><th>鼓膜<\/th><td>音をとらえて振動する。<\/td><\/tr>\n<tr><th>耳小骨<\/th><td>鼓膜の振動をうずまき管に伝える。<\/td><\/tr>\n<tr><th>うずまき管<\/th><td>音の刺激を受けとる細胞がある。<\/td><\/tr><\/table>\n<h2>神経系<\/h2>\n<ul>\n<li><b class=g>中枢神経<\/b>…判断や命令を行う<b class=g>脳<\/b>と<b class=g>せきずい<\/b>。<\/li>\n<li><b class=g>末しょう神経<\/b>…中枢神経から枝分かれして全身に広がる神経。<b class=g>感覚神経<\/b>（感覚器官→中枢神経）と<b class=g>運動神経<\/b>（中枢神経→運動器官）など。<\/li>\n<li>中枢神経と末しょう神経をまとめて<b class=g>神経系<\/b>という。<\/li>\n<\/ul>\n<h2>意識して起こす反応と反射<\/h2>\n<table class=t><tr><th>意識して起こす反応<\/th><td>感覚器官 → 感覚神経 →（せきずい）→ <b class=b>脳<\/b> →（せきずい）→ 運動神経 → 筋肉<\/td><\/tr>\n<tr><th>反射<\/th><td>感覚器官 → 感覚神経 → <b class=b>せきずい<\/b> → 運動神経 → 筋肉<\/td><\/tr><\/table>\n<ul>\n<li><b class=g>反射<\/b>…刺激を受けて、意識とは無関係に決まった反応が起こること。命令の信号は<b class=b>せきずい<\/b>から直接出る。<\/li>\n<li>反射は反応までの時間が短い：信号が脳に伝わる前に、せきずいから命令が出されるから。<\/li>\n<li>反射の例：熱いものにふれて思わず手を引っこめる／ひざの下をたたくと足がはね上がる／食べ物を口に入れるとだ液が出る。<\/li>\n<\/ul>\n<div class=box><b>計算の型<\/b>　1人あたりの時間＝全体の時間÷人数　（例：6人で1.5秒 → 1.5÷6＝0.25秒）<br>\n信号の速さ＝神経の長さ÷（反応時間−脳が判断する時間）　（例：1.2 m÷（0.2−0.18）秒＝60 m/秒）<\/div>\n<h2>骨と筋肉<\/h2>\n<ul>\n<li>骨のはたらき：からだを支える。内臓や脳などやわらかい部分を保護する。<\/li>\n<li><b class=g>関節<\/b>…骨と骨のつなぎめ。<b class=g>けん<\/b>…筋肉の両端にあり、筋肉と骨をつなぐ部分。<\/li>\n<li>うでの骨には、向き合うように2つの筋肉がついている。<b class=b>一方が縮むと、もう一方はゆるむ（のばされる）<\/b>。<\/li>\n<li>うでを曲げる：内側の筋肉が縮む。うでをのばす：外側の筋肉が縮み、内側の筋肉がのばされる。<\/li>\n<\/ul>\n", "fill": [{"q": "目や耳、皮膚などのように、外界からの刺激を受けとる器官を【　？　】という。", "a": "感覚器官", "o": ["運動器官", "消化器官", "呼吸器官", "中枢神経"]}, {"q": "目で、像が結ばれ、光の刺激を受けとる細胞があるところを【　？　】という。耳で、音をとらえて振動する膜を（　　）という。", "a": "網膜", "o": ["鼓膜", "虹彩", "レンズ", "角膜"]}, {"q": "目で、像が結ばれ、光の刺激を受けとる細胞があるところを（　　）という。耳で、音をとらえて振動する膜を【　？　】という。", "a": "鼓膜", "o": ["網膜", "耳小骨", "うずまき管", "角膜"]}, {"q": "感覚器官で受けとった刺激は信号に変えられ、【　？　】を通って脳に伝えられる。", "a": "感覚神経", "o": ["運動神経", "中枢神経", "せきずい"]}, {"q": "感覚器官で受けとった刺激は信号に変えられ、感覚神経を通って【　？　】に伝えられる。", "a": "脳", "o": ["せきずい", "心臓", "筋肉", "皮膚"]}, {"q": "判断や命令を行う脳やせきずいを【　？　】といい、そこから枝分かれして全身に広がる神経を（　　）という。この2つをまとめて神経系という。", "a": "中枢神経", "o": ["末しょう神経", "感覚神経", "運動神経"]}, {"q": "判断や命令を行う脳やせきずいを中枢神経といい、そこから枝分かれして全身に広がる神経を【　？　】という。この2つをまとめて神経系という。", "a": "末しょう神経", "o": ["感覚器官", "運動器官", "せきずい", "筋肉"]}, {"q": "判断や命令を行う脳やせきずいを中枢神経といい、そこから枝分かれして全身に広がる神経を末しょう神経という。この2つをまとめて【　？　】という。", "a": "神経系", "o": ["消化系", "循環系", "呼吸系", "感覚器官"]}, {"q": "中枢神経からの命令の信号を筋肉などの運動器官に伝える神経を【　？　】という。", "a": "運動神経", "o": ["感覚神経", "中枢神経", "せきず   head(s.ttl+(mode==='mix'?'　復習':mode==='f'?'　4択':'　一問一答'),true);
  let p=0,ok=0;
  const mark=(m,k,good)=>{const r=rec(i,m,k);S.a[i+m+k]=[r[0]+1,r[1]+(good?1:0),good?1:0];if(good)ok++;save();fx(good)};
  const next=()=>{p++;p<items.length?show():finish()};
  function finish(){
    head(s.ttl+'　結果',true);
    app.innerHTML=`<div class="card c" style="margin:auto 0"><div class="mut">今回の正答率</div><div class="big">${pct(ok,items.length)}</div>
    <p style="margin:.3em 0 .8em">${ok} / ${items.length} 問 正解<br>${ok===items.length?'全問正解です。':'まちがえた問題は「復習」で解き直せます。'}</p>
    <div class="two"><button class="btn" id="again">${mode==='mix'?'復習を続ける':'もう一度'}</button><button class="btn p" id="back">メニューへ</button></div></div>`;
    $('#again').onclick=()=>mode==='mix'?review(i):run(i,mode,null);$('#back').onclick=home;
  }
  function show(){
    const [m,k]=items[p],top=`<div class="top"><div class="mut"><span>${p+1} / ${items.length}</span><span>正解 ${ok}</span></div><div class="bar"><i style="width:${p/items.length*100}%"></i></div></div>`;
    if(m==='f'){
      const it=s.fill[k];
      const opts=shuf([it.a,...shuf(it.o).slice(0,3)]);
      app.innerHTML=`${top}<div class="card scr" id="fb"><div class="q" style="font-weight:400">${esc(it.q)}</div></div>
      <div class="low"><div class="grid">${opts.map(o=>`<button class="opt"><span>${esc(o)}</span></button>`).join('')}</div><button class="btn p" id="n" style="visibility:hidden">次へ</button></div>`;
      const bs=[...app.querySelectorAll('.opt')];bs.forEach(b=>fitBox(b,38,15));
      bs.forEach(b=>b.onclick=()=>{const good=b.textContent===it.a;bs.forEach(x=>{x.disabled=true;if(x.textContent===it.a)x.classList.add('ok')});
        if(!good)b.classList.add('ng');mark('f',k,good);
        if(good)setTimeout(next,800);else{$('#n').style.visibility='visible';$('#n').onclick=next}});
    }else{
      const it=s.qa[k];
      app.innerHTML=`${top}<div class="card scr" id="fb"><div class="t">${esc(it.t)}　(${it.n})</div><div class="q">${esc(it.q)}</div>
      <div class="lead"><b style="color:var(--g)">設定</b>　${it.lead}</div></div>
      <div class="low" id="lw"><button class="btn p" id="rv">答えを見る</button></div>`;
      $('#rv').onclick=()=>{$('#lw').innerHTML=`<div class="bans" id="ba"><span>${esc(it.a)}</span></div><div class="two" style="flex:none"><button class="btn red" id="x">❌ まちがえた</button><button class="btn p" id="o">⭕ 合っていた</button></div>`;
        {const b=$('#ba');let fs=44;b.style.fontSize=fs+'px';while((b.scrollHeight>b.clientHeight+1||b.scrollWidth>b.clientWidth+1||b.firstChild.offsetHeight>b.clientHeight-8)&&fs>13){fs-=1;b.style.fontSize=fs+'px'}}
        const go=g=>{$('#o').disabled=$('#x').disabled=true;mark('q',k,g);setTimeout(next,750)};
        $('#o').onclick=()=>go(true);$('#x').onclick=()=>go(false)};
    }
  }
  show();
}
home();
</script></body></html>
